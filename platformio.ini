[env:esp32-s3-devkitc-1]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.partitions = partitions_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; TFT_eSPI: PlatformIO LDF ставит собственную папку библиотеки в -I
    ; РАНЬШЕ наших -I, поэтому попытка подменить <User_Setup.h> через порядок
    ; путей поиска не работает — компилятор находит библиотечный
    ; User_Setup.h (ILI9341, пины классического ESP32) вместо нашего.
    ; Вместо этого прямо форсируем свой файл через -include и отключаем
    ; #include <User_Setup.h> флагом USER_SETUP_LOADED (см. User_Setup_Select.h).
    -D USER_SETUP_LOADED=1
    -include include/tft_config/User_Setup.h
    -I include/tft_config
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -std=gnu++17
build_unflags =
    -std=gnu++11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

lib_deps =
    lvgl/lvgl @ ^9.2.0
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.4

; ---------------------------------------------------------------------------
; Нативное окружение для юнит-тестов (железо не нужно): pio test -e native
; Здесь собираются только модули с чистой логикой (climate_math).
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I include
; Собираем только тестируемый модуль с чистой логикой — всё остальное в
; src/ зависит от заголовков Arduino/FreeRTOS, которых нет на нативной платформе.
build_src_filter = +<climate_math.cpp>
test_filter = test_climate_math
