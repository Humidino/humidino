<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humidino</title>
<style>
  body { font-family: sans-serif; background:#101418; color:#e8e8e8; margin:0; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .card { background:#1b2128; border-radius:8px; padding:10px; }
  .card h2 { font-size:13px; margin:0 0 6px; color:#9aa5b1; font-weight:normal; }
  .card .val { font-size:18px; }
  .err { color:#e04040; font-weight:bold; }
  #banner { text-align:center; padding:14px; border-radius:8px; font-size:20px; font-weight:bold; margin-bottom:16px; }
  form label { display:block; margin:8px 0 4px; font-size:13px; color:#9aa5b1; }
  form input { width:100%; box-sizing:border-box; padding:6px; border-radius:4px; border:1px solid #333; background:#1b2128; color:#eee; }
  button { margin-top:12px; padding:8px 16px; border:none; border-radius:6px; background:#2e8b45; color:white; cursor:pointer; }
</style>
</head>
<body>
<h1>Humidino — контроль подпола</h1>
<div id="banner">—</div>
<div class="grid" id="zones"></div>

<form id="settingsForm">
  <label>Порог влажности подпола, % (rh_target)</label>
  <input type="number" step="0.1" id="rh_target">
  <label>Гистерезис, % (hysteresis_pct)</label>
  <input type="number" step="0.1" id="hysteresis_pct">
  <label>Защита от замерзания, °C (freeze_c)</label>
  <input type="number" step="0.1" id="freeze_c">
  <button type="submit">Сохранить</button>
</form>

<script>
const zoneNames = {
  crawl_intake: "Приточка подпола",
  crawl_corner: "Дальний угол подпола",
  outside: "Улица",
  house: "Дом",
};
const bannerText = {0:"ОЖИДАНИЕ",1:"РАБОТА",2:"ЗАПРЕТ ПО КОНДЕНСАТУ",3:"ЗАПРЕТ ПО МОРОЗУ",4:"ОЖИДАНИЕ"};
const bannerColor = {0:"#3a4a5a",1:"#2e8b45",2:"#c97a1e",3:"#c97a1e",4:"#3a4a5a"};

async function refreshState() {
  try {
    const r = await fetch('/api/state');
    const s = await r.json();
    const banner = document.getElementById('banner');
    banner.textContent = bannerText[s.relay.state] ?? '?';
    banner.style.background = bannerColor[s.relay.state] ?? '#333';

    const zonesEl = document.getElementById('zones');
    zonesEl.innerHTML = '';
    for (const key in zoneNames) {
      const z = s.zones[key];
      const div = document.createElement('div');
      div.className = 'card';
      let html = `<h2>${zoneNames[key]}</h2><div class="val">${z.temp_c.toFixed(1)}°C / ${z.rh_pct.toFixed(1)}%</div>`;
      if (z.dew_c !== undefined) html += `<div>Точка росы: ${z.dew_c.toFixed(1)}°C</div>`;
      if (z.error) html += `<div class="err">ERR</div>`;
      div.innerHTML = html;
      zonesEl.appendChild(div);
    }
  } catch (e) { /* временный сбой — повторится на следующем тике */ }
}

async function loadSettings() {
  const r = await fetch('/api/settings');
  const s = await r.json();
  document.getElementById('rh_target').value = s.rh_target;
  document.getElementById('hysteresis_pct').value = s.hysteresis_pct;
  document.getElementById('freeze_c').value = s.freeze_c;
}

document.getElementById('settingsForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const body = {
    rh_target: parseFloat(document.getElementById('rh_target').value),
    hysteresis_pct: parseFloat(document.getElementById('hysteresis_pct').value),
    freeze_c: parseFloat(document.getElementById('freeze_c').value),
  };
  await fetch('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
});

refreshState();
loadSettings();
setInterval(refreshState, 3000);
</script>
</body>
</html>
